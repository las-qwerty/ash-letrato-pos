name: OTA bundle (over-the-air app update)

# Publishes the web build as a downloadable bundle. Installed apps fetch
# app-version.json on launch and hot-swap to the new bundle next restart.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'packages/core/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -w @simmy/web

      - name: Package bundle
        run: |
          cd apps/web/out
          zip -qr "$GITHUB_WORKSPACE/app-bundle.zip" .
          VERSION="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          printf '{"version":"%s","url":"https://raw.githubusercontent.com/%s/ota/app-bundle.zip"}' \
            "$VERSION" "$GITHUB_REPOSITORY" > "$GITHUB_WORKSPACE/app-version.json"
          echo "version=$VERSION" >> "$GITHUB_ENV"

      # Publishes to a dedicated `ota` branch instead of release assets —
      # raw.githubusercontent.com serves files with a direct 200, while
      # release download URLs 302-redirect (which native downloaders drop).
      - name: Publish to ota branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout --orphan ota-publish
          git rm -rf . >/dev/null 2>&1 || true
          git add app-bundle.zip app-version.json
          git commit -m "OTA bundle $version"
          git push -f origin ota-publish:ota
