name: Windows build (Setup.exe via Tauri)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run build -w @simmy/web

      # The updater only fires when the manifest version exceeds the
      # installed one — stamp each build with the run number so every push
      # produces a strictly newer release (0.1.<run>). tauri.conf.json
      # feeds the updater manifest; Cargo.toml feeds the binary version.
      - name: Stamp build version
        working-directory: apps/desktop
        shell: bash
        run: >-
          node -e "const fs=require('fs');const v='0.1.${{ github.run_number }}';
          const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));
          j.version=v;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');
          const c='src-tauri/Cargo.toml';
          fs.writeFileSync(c,fs.readFileSync(c,'utf8').replace(/^version = \".*\"$/m,'version = \"'+v+'\"'));"

      # Signs updater artifacts + emits latest.json into the release — the
      # desktop app self-updates from it on launch. Needs repo secret
      # TAURI_SIGNING_PRIVATE_KEY (minisign private key; no password).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-latest
          releaseName: 'ASH LETRATO POS — Windows'
          body: 'Run Setup.exe. The shell enables silent printing — receipts go straight to the default printer.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      # Stable filename for the marketing site — Tauri's artifact name embeds
      # the version, so also upload a fixed-name copy of the NSIS installer.
      - name: Publish fixed-name installer copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "ash-letrato-pos-setup.exe"
          gh release upload desktop-latest ash-letrato-pos-setup.exe --clobber

      - name: Publish updater manifest
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NSIS=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          MSI=$(ls target/release/bundle/msi/*.msi | head -1)
          node -e '
            const fs = require("fs");
            const [nsis, msi] = process.argv.slice(1);
            const platform = (file) => ({
              signature: fs.readFileSync(file + ".sig", "utf8").trim(),
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/desktop-latest/${file.split("/").pop().replace(/ /g, ".")}`,
            });
            const nsisPlatform = platform(nsis);
            const manifest = {
              version: JSON.parse(fs.readFileSync("tauri.conf.json", "utf8")).version,
              notes: "",
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": nsisPlatform,
                "windows-x86_64-nsis": nsisPlatform,
                "windows-x86_64-msi": platform(msi),
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$NSIS" "$MSI"
          gh release upload desktop-latest latest.json --clobber
