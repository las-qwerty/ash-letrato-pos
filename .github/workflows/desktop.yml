name: Windows build (Setup.exe via Tauri)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/public/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run build -w @simmy/web

      # The updater only fires when the manifest version exceeds the
      # installed one — stamp each build with the run number so every push
      # produces a strictly newer release (0.1.<run>).
      - name: Stamp build version
        working-directory: apps/desktop
        run: npx tauri version "0.1.${{ github.run_number }}"

      # Signs updater artifacts + emits latest.json into the release — the
      # desktop app self-updates from it on launch. Needs repo secret
      # TAURI_SIGNING_PRIVATE_KEY (minisign private key; no password).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-latest
          releaseName: 'ASH LETRATO POS — Windows'
          body: 'Run Setup.exe. The shell enables silent printing — receipts go straight to the default printer.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      # Stable filename for the marketing site — Tauri's artifact name embeds
      # the version, so also upload a fixed-name copy of the NSIS installer.
      - name: Publish fixed-name installer copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "ash-letrato-pos-setup.exe"
          gh release upload desktop-latest ash-letrato-pos-setup.exe --clobber
